name: Authenticated deployment scheduler
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: authenticated-central-scheduler
  cancel-in-progress: false
jobs:
  service:
    if: github.repository == 'VAclavVrobelv/avatomis-central-scheduler' && github.ref == 'refs/heads/main' && github.event.repository.private == false && (vars.SCHEDULER_ENABLED == '' || vars.SCHEDULER_ENABLED == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run and verify existing authorized deployment work
        id: worker
        env:
          CENTRAL_SCHEDULER_KEY: ${{ secrets.CENTRAL_SCHEDULER_KEY }}
        run: python3 -u scheduler.py
